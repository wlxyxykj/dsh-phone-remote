<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="color-scheme" content="dark light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b0f16">
<meta name="referrer" content="no-referrer">
<title>DSH 遥控</title>
<style>
:root{
  --bg:#0b0f16; --bg-2:#111823; --bg-3:#18202e; --line:#243044;
  --fg:#e8eef8; --fg-dim:#93a2b8; --fg-faint:#64748b;
  --accent:#4c8dff; --accent-2:#2f6fe0; --ok:#3ddc97; --warn:#ffb454; --err:#ff6b6b;
  --radius:14px;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{
  background:var(--bg); color:var(--fg);
  font:16px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  overscroll-behavior-y:none;
}
button,input,textarea{font:inherit;color:inherit}
button{background:none;border:none;padding:0;cursor:pointer}
.hidden{display:none!important}

/* ── shell ───────────────────────────────────────────────────────────── */
#app{display:flex;flex-direction:column;height:100dvh}
header{
  position:sticky;top:0;z-index:20;
  padding:calc(var(--safe-top) + 8px) 12px 8px;
  background:rgba(11,15,22,.86);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:10px;
}
header .meta{min-width:0;flex:1}
header .title{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .sub{font-size:11.5px;color:var(--fg-faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.icon-btn{
  width:38px;height:38px;border-radius:11px;background:var(--bg-3);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-size:17px;flex:none;
}
.icon-btn:active{background:var(--bg-2)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--fg-faint);flex:none;margin-right:2px}
.dot.on{background:var(--ok);box-shadow:0 0 0 3px rgba(61,220,151,.16)}
.dot.busy{background:var(--warn);animation:pulse 1.1s ease-in-out infinite}
.dot.off{background:var(--err)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

#log{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 12px 8px;display:flex;flex-direction:column;gap:10px}
.row{display:flex;max-width:100%}
.row.me{justify-content:flex-end}
.bubble{
  max-width:86%;padding:10px 13px;border-radius:var(--radius);
  background:var(--bg-2);border:1px solid var(--line);
  white-space:pre-wrap;word-break:break-word;overflow-wrap:anywhere;
  font-size:15px;
}
.row.me .bubble{background:linear-gradient(180deg,var(--accent),var(--accent-2));border-color:transparent;color:#fff}
.bubble.sys{background:transparent;border:1px dashed var(--line);color:var(--fg-dim);font-size:13px;max-width:100%}
.bubble.err{border-color:rgba(255,107,107,.5);color:#ffd9d9;background:rgba(255,107,107,.08)}
.md code{background:#000a;padding:1px 5px;border-radius:5px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px}
.md pre{background:#05080d;border:1px solid var(--line);border-radius:10px;padding:9px 11px;overflow-x:auto;margin:8px 0}
.md pre code{background:none;padding:0;font-size:12.5px;line-height:1.45}
.md p{margin:0 0 8px}
.md>*:last-child{margin-bottom:0}
.md h1,.md h2,.md h3,.md h4,.md h5,.md h6{margin:12px 0 6px;line-height:1.3}
.md h1{font-size:18px} .md h2{font-size:16.5px} .md h3{font-size:15.5px}
.md h4,.md h5,.md h6{font-size:15px;color:var(--fg-dim)}
.md ul,.md ol{margin:6px 0 8px;padding-left:22px}
.md li{margin:2px 0}
.md blockquote{margin:8px 0;padding:2px 0 2px 11px;border-left:3px solid var(--line);color:var(--fg-dim)}
.md hr{border:none;border-top:1px solid var(--line);margin:12px 0}
.md a{color:#7fb2ff}
.md del{opacity:.65}
.md strong{color:#fff}

/* reasoning stays out of the way: one collapsed line */
.think{align-self:flex-start;max-width:92%;width:100%;margin:-2px 0 0}
.think summary{list-style:none;cursor:pointer;font-size:12px;color:var(--fg-faint);
  padding:6px 10px;border:1px dashed var(--line);border-radius:10px;background:#0c121b;
  display:flex;align-items:center;gap:7px}
.think summary::-webkit-details-marker{display:none}
.think[open] summary{border-bottom-left-radius:0;border-bottom-right-radius:0;border-bottom-color:transparent}
.think .body{padding:9px 12px;border:1px dashed var(--line);border-top:none;border-radius:0 0 10px 10px;
  background:#0a0f17;color:var(--fg-faint);font-size:12.5px;line-height:1.5;white-space:pre-wrap;
  word-break:break-word;max-height:40vh;overflow-y:auto}
.think.pending summary{color:var(--fg-dim)}

/* ── file transfer ──────────────────────────────────────────────────── */
#pending{display:flex;flex-wrap:wrap;gap:6px;padding:0 2px 8px}
.chip{display:flex;align-items:center;gap:6px;max-width:100%;background:var(--bg-3);border:1px solid var(--line);
  border-radius:999px;padding:4px 10px;font-size:12px;color:var(--fg-dim)}
.chip .n{max-width:46vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip .x{color:var(--fg-faint);font-size:13px;padding:0 2px}
.chip.up{border-color:#3c5c96;color:var(--fg)}
.chip.bad{border-color:rgba(255,107,107,.5);color:#ffd9d9}
.filecard{align-self:flex-start;max-width:92%;width:100%;display:flex;align-items:center;gap:10px;
  background:#0d1620;border:1px solid #2b4a6f;border-radius:12px;padding:10px 12px;text-decoration:none;color:var(--fg)}
.filecard .ic{font-size:20px;flex:none}
.filecard .meta{min-width:0;flex:1}
.filecard .meta .t{font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.filecard .meta .d{font-size:11.5px;color:var(--fg-faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.filecard .dl{font-size:12px;color:#7fb2ff;flex:none}
.attach{width:42px;height:42px;font-size:17px;padding:0}

.tool{
  align-self:flex-start;max-width:92%;width:100%;
  background:#0e141d;border:1px solid var(--line);border-radius:12px;overflow:hidden;
}
.tool summary{list-style:none;cursor:pointer;padding:9px 12px;display:flex;align-items:center;gap:8px;font-size:13px}
.tool summary::-webkit-details-marker{display:none}
.tool .name{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;color:#cfe0ff;flex:none}
.tool .sum{color:var(--fg-faint);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.tool .st{font-size:11px;color:var(--warn);flex:none}
.tool .st.ok{color:var(--ok)} .tool .st.bad{color:var(--err)}
.tool pre{margin:0;padding:0 12px 11px;overflow-x:auto;font-family:ui-monospace,Menlo,monospace;font-size:12px;
  color:var(--fg-dim);max-height:46vh;overflow-y:auto;white-space:pre-wrap;word-break:break-word}
.caret::after{content:"▍";color:var(--accent);animation:pulse 1s steps(2) infinite}

#composer{
  position:sticky;bottom:0;z-index:20;
  padding:8px 10px calc(var(--safe-bottom) + 8px);
  background:rgba(11,15,22,.9);backdrop-filter:blur(14px);border-top:1px solid var(--line);
}
#composer .box{display:flex;align-items:flex-end;gap:8px}
#text{
  flex:1;min-height:42px;max-height:32vh;resize:none;overflow-y:auto;
  background:var(--bg-3);border:1px solid var(--line);border-radius:12px;
  padding:10px 12px;font-size:16px;line-height:1.4;outline:none;
}
#text:focus{border-color:#33507e}
.send{
  width:42px;height:42px;border-radius:12px;flex:none;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(180deg,var(--accent),var(--accent-2));color:#fff;font-size:18px;
}
.send:disabled{opacity:.4}
.send.stop{background:linear-gradient(180deg,#ff7b7b,#e04545)}
#composer .hint{font-size:11.5px;color:var(--fg-faint);margin-top:6px;display:flex;justify-content:space-between;gap:8px}
#composer .hint b{color:var(--fg-dim);font-weight:500}

/* ── drawer ──────────────────────────────────────────────────────────── */
#scrim{position:fixed;inset:0;background:#000a;z-index:29;opacity:0;transition:opacity .18s;pointer-events:none}
#scrim.on{opacity:1;pointer-events:auto}
#drawer{
  position:fixed;top:0;right:0;bottom:0;width:min(86vw,360px);z-index:30;
  background:var(--bg-2);border-left:1px solid var(--line);
  transform:translateX(101%);transition:transform .2s ease;
  display:flex;flex-direction:column;padding-top:var(--safe-top);
}
#drawer.on{transform:none}
#drawer .hd{padding:14px 14px 8px;display:flex;align-items:center;justify-content:space-between}
#drawer .hd h2{margin:0;font-size:15px}
#drawer .list{flex:1;overflow-y:auto;padding:4px 10px 10px;display:flex;flex-direction:column;gap:7px}
.sess{
  text-align:left;padding:10px 12px;border-radius:11px;background:var(--bg-3);border:1px solid var(--line);
  display:flex;flex-direction:column;gap:3px;
}
.sess.active{border-color:var(--accent);background:#152341}
.sess .t{font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sess .d{font-size:11px;color:var(--fg-faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#drawer .ft{padding:10px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
#newcwd{
  width:100%;background:var(--bg-3);border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-size:13px;outline:none;
}
.btn{
  padding:10px 12px;border-radius:11px;background:var(--bg-3);border:1px solid var(--line);
  font-size:14px;text-align:center;
}
.btn.primary{background:linear-gradient(180deg,var(--accent),var(--accent-2));border-color:transparent;color:#fff}
.btn:active{opacity:.85}

/* ── gate / empty states ────────────────────────────────────────────── */
.center{
  min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:14px;padding:24px calc(24px + env(safe-area-inset-left)) 24px;
  text-align:center;
}
.center h1{font-size:19px;margin:0}
.center p{margin:0;color:var(--fg-dim);font-size:14px;max-width:30em}
.center input{
  width:100%;max-width:340px;background:var(--bg-3);border:1px solid var(--line);border-radius:12px;
  padding:13px 14px;font-size:16px;text-align:center;font-family:ui-monospace,Menlo,monospace;outline:none;
}
.center .btn{max-width:340px;width:100%}
.err-text{color:var(--err);font-size:13px;min-height:18px}
</style>
</head>
<body>

<!-- token gate (only shown when the link/cookie is missing or stale) -->
<div id="gate" class="center hidden">
  <div style="font-size:40px">📱</div>
  <h1>需要访问口令</h1>
  <p>请打开电脑上 DSH 插件面板显示的完整链接，或在下面粘贴访问口令。</p>
  <input id="gate-token" placeholder="access token" autocomplete="off" autocapitalize="off" spellcheck="false">
  <button class="btn primary" id="gate-go">连接</button>
  <div class="err-text" id="gate-err"></div>
</div>

<!-- last-resort card: shown only if the module script never boots (never a blank screen) -->
<div id="boot-error" class="center hidden">
  <div style="font-size:40px">⚠️</div>
  <h1>页面没能启动</h1>
  <p id="boot-error-text">请下拉刷新一次；如果还是这样，用电脑面板上的二维码重新扫一次。</p>
</div>

<!-- classic (non-module) watchdog: runs even when the module import fails -->
<script>
  window.setTimeout(function () {
    if (window.__mobileRemoteBooted) return;
    var gate = document.getElementById("gate");
    var app = document.getElementById("app");
    if (gate && !gate.classList.contains("hidden")) return;
    if (app && !app.classList.contains("hidden")) return;
    document.getElementById("boot-error").classList.remove("hidden");
  }, 3000);
</script>

<!-- main app -->
<div id="app" class="hidden">
  <header>
    <button class="icon-btn" id="btn-menu" aria-label="会话">☰</button>
    <div class="meta">
      <div class="title" id="h-title">DSH 遥控</div>
      <div class="sub" id="h-sub"><span class="dot" id="h-dot"></span><span id="h-state">连接中…</span></div>
    </div>
    <button class="icon-btn" id="btn-reload" aria-label="重连">⟳</button>
  </header>

  <div id="log"></div>

  <div id="composer">
    <div id="pending" class="hidden"></div>
    <div class="box">
      <button class="icon-btn attach" id="btn-attach" aria-label="上传文件">📎</button>
      <textarea id="text" rows="1" placeholder="给电脑上的 Agent 派活，或先用 📎 传个文件…" enterkeyhint="send"></textarea>
      <button class="send" id="btn-send" aria-label="发送">↑</button>
    </div>
    <input type="file" id="file-input" multiple hidden>
    <div class="hint">
      <span id="c-hint">未选择会话</span>
      <span id="c-tip">发送 = 排队执行</span>
    </div>
  </div>
</div>

<div id="scrim"></div>
<aside id="drawer">
  <div class="hd">
    <h2>会话</h2>
    <button class="icon-btn" id="drawer-close" aria-label="关闭">✕</button>
  </div>
  <div class="list" id="sess-list"></div>
  <div class="ft">
    <input id="newcwd" placeholder="新会话工作目录（可选）" autocomplete="off" spellcheck="false">
    <button class="btn primary" id="btn-new">＋ 新建会话并接管</button>
  </div>
</aside>

<script type="module">
import { mdToNodes } from "/m/markdown.js";
// Tells the classic watchdog above that the module actually booted.
window.__mobileRemoteBooted = true;
"use strict";
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var TOKEN_KEY = "dsh-mobile-token";

  var state = {
    token: "",
    sessionId: "",
    sessions: [],
    running: false,
    lastSeq: 0,
    es: null,
    retry: 0,
    live: null,          // { el, text } streaming assistant bubble
    thinking: null,      // the live "💭 思考中…" placeholder element
    pending: [],         // files uploaded from this phone, waiting to be sent
    delivered: {},       // deliverable ids already rendered as download cards
    toolEls: {},         // callId -> { el, statusEl, outEl }
    started: false
  };

  /* ── token plumbing ─────────────────────────────────────────────── */
  function tokenFromUrl() {
    try {
      var u = new URL(location.href);
      var t = u.searchParams.get("t") || (u.hash.length > 1 ? u.hash.slice(1) : "");
      return t || "";
    } catch (e) { return ""; }
  }
  function storedToken() {
    try { return localStorage.getItem(TOKEN_KEY) || ""; } catch (e) { return ""; }
  }
  function rememberToken(t) {
    try { localStorage.setItem(TOKEN_KEY, t); } catch (e) {}
  }
  state.token = tokenFromUrl() || storedToken();
  if (tokenFromUrl()) {
    rememberToken(state.token);
    // Keep the secret out of the address bar / history / screenshots.
    try { history.replaceState(null, "", location.pathname); } catch (e) {}
  }

  /* ── tiny API client ────────────────────────────────────────────── */
  function api(path, options) {
    options = options || {};
    var headers = { "accept": "application/json" };
    if (options.body !== undefined) headers["content-type"] = "application/json";
    if (state.token) headers["x-mobile-token"] = state.token;
    return fetch(path, {
      method: options.method || "GET",
      headers: headers,
      credentials: "same-origin",
      body: options.body === undefined ? undefined : JSON.stringify(options.body)
    }).then(function (res) {
      return res.json().catch(function () { return {}; }).then(function (data) {
        if (res.status === 401) { var e = new Error("unauthorized"); e.code = 401; throw e; }
        if (!res.ok) {
          var msg = (data && data.error && data.error.message) || ("HTTP " + res.status);
          var err = new Error(msg); err.code = res.status; throw err;
        }
        return data;
      });
    });
  }

  /* ── rendering helpers ──────────────────────────────────────────── */
  function el(tag, cls, text) {
    var node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text !== undefined && text !== null) node.textContent = text;
    return node;
  }
  function atBottom() {
    var log = $("log");
    return log.scrollHeight - log.scrollTop - log.clientHeight < 90;
  }
  function scrollDown(force) {
    var log = $("log");
    if (force || atBottom()) log.scrollTop = log.scrollHeight;
  }
  /** Visible answer text — reasoning blocks are deliberately excluded. */
  function text(blocks) {
    if (typeof blocks === "string") return blocks;
    if (!Array.isArray(blocks)) return "";
    var out = [];
    for (var i = 0; i < blocks.length; i++) {
      var b = blocks[i];
      if (!b) continue;
      if (b.type === "reasoning") continue;
      if (b.type === "text" && typeof b.text === "string") out.push(b.text);
      else if (b.type === "tool-result") out.push(text(b.content));
    }
    return out.join("\n");
  }
  /** The model's thinking, kept separately so it can be collapsed. */
  function reasoningText(blocks) {
    if (!Array.isArray(blocks)) return "";
    var out = [];
    for (var i = 0; i < blocks.length; i++) {
      var b = blocks[i];
      if (b && b.type === "reasoning" && typeof b.text === "string") out.push(b.text);
    }
    return out.join("\n");
  }
  /** Turn a parser node tree into real elements (textContent only → no injection). */
  function mountNodes(nodes) {
    var fragment = document.createDocumentFragment();
    (nodes || []).forEach(function (node) { fragment.appendChild(mountNode(node)); });
    return fragment;
  }
  function mountNode(node) {
    if (!node) return document.createTextNode("");
    if (node.tag === "text") return document.createTextNode(node.text || "");
    if (node.tag === "br") return document.createElement("br");
    if (node.tag === "hr") return document.createElement("hr");
    if (node.tag === "pre") {
      var pre = el("pre"), code = el("code");
      code.textContent = node.code || "";
      pre.appendChild(code);
      return pre;
    }
    if (node.tag === "code") return el("code", null, node.text || "");
    if (node.tag === "a") {
      var a = el("a", null, "");
      a.href = node.href;
      a.target = "_blank";
      a.rel = "noopener noreferrer";
      a.appendChild(mountNodes(node.children));
      return a;
    }
    var element = el(node.tag);
    element.appendChild(mountNodes(node.children));
    return element;
  }
  function md(raw) {
    var wrap = el("div", "md");
    wrap.appendChild(mountNodes(mdToNodes(String(raw == null ? "" : raw))));
    return wrap;
  }
  /** A collapsed "thinking" block; `pending` shows it while the model is still reasoning. */
  function addThinking(bodyText, pending) {
    var box = el("details", "think" + (pending ? " pending" : ""));
    var summary = el("summary");
    summary.appendChild(el("span", null, pending ? "💭 思考中…" : "💭 思考过程"));
    if (!pending) summary.appendChild(el("span", null, "（点击展开）"));
    var body = el("div", "body", bodyText || "");
    box.appendChild(summary);
    box.appendChild(body);
    $("log").appendChild(box);
    scrollDown();
    return box;
  }
  function addBubble(kind, raw) {
    closeLive();
    var row = el("div", "row" + (kind === "me" ? " me" : ""));
    if (kind === "sys" || kind === "err") {
      var b0 = el("div", "bubble " + (kind === "err" ? "err" : "sys"), String(raw));
      row.appendChild(b0);
      $("log").appendChild(row);
      scrollDown(kind === "me");
      return row;
    }
    var bubble = el("div", "bubble");
    bubble.appendChild(md(raw));
    row.appendChild(bubble);
    $("log").appendChild(row);
    scrollDown();
    return row;
  }
  function addTool(callId, name, argsText) {
    closeLive();
    clearThinking();
    var box = el("details", "tool");
    var sum = el("summary");
    sum.appendChild(el("span", "name", name));
    var args = el("span", "sum");
    args.textContent = shortArgs(argsText);
    sum.appendChild(args);
    var st = el("span", "st", "运行中");
    sum.appendChild(st);
    var out = el("pre", null, "");
    box.appendChild(sum);
    box.appendChild(out);
    $("log").appendChild(box);
    scrollDown();
    state.toolEls[callId] = { box: box, sum: sum, args: args, status: st, out: out };
    return state.toolEls[callId];
  }
  function shortArgs(argsText) {
    if (!argsText) return "";
    try {
      var o = typeof argsText === "string" ? JSON.parse(argsText) : argsText;
      var first = o && typeof o === "object" ? (o.command || o.path || o.pattern || o.file_path || o.query || Object.values(o)[0]) : "";
      return first === undefined ? "" : String(first).replace(/\s+/g, " ").slice(0, 90);
    } catch (e) {
      return String(argsText).replace(/\s+/g, " ").slice(0, 90);
    }
  }
  function finishTool(callId, resultText, isError) {
    var t = state.toolEls[callId];
    if (!t) return;
    t.status.textContent = isError ? "失败" : "完成";
    t.status.className = "st " + (isError ? "bad" : "ok");
    t.out.textContent = String(resultText || "").slice(0, 20000);
  }
  function openLive() {
    if (state.live) return state.live;
    var row = el("div", "row");
    var bubble = el("div", "bubble");
    bubble.appendChild(el("span", "caret"));
    row.appendChild(bubble);
    $("log").appendChild(row);
    state.live = { row: row, bubble: bubble, text: "" };
    scrollDown();
    return state.live;
  }
  function pushLive(delta) {
    var live = openLive();
    live.text += delta;
    live.bubble.textContent = "";
    live.bubble.appendChild(md(live.text));
    live.bubble.appendChild(el("span", "caret"));
    scrollDown();
  }
  function closeLive() {
    if (!state.live) return;
    var live = state.live;
    state.live = null;
    if (!live.text.trim()) { live.row.remove(); return; }
    live.bubble.textContent = "";
    live.bubble.appendChild(md(live.text));
  }
  /** Drop the live bubble without keeping its text (a committed message follows). */
  function discardLive() {
    if (!state.live) return;
    var live = state.live;
    state.live = null;
    live.row.remove();
  }
  /** One-line "still thinking" placeholder, replaced by the collapsed block later. */
  function showThinking() {
    if (state.thinking || state.live) return;
    state.thinking = addThinking("", true);
  }
  function clearThinking() {
    if (!state.thinking) return;
    state.thinking.remove();
    state.thinking = null;
  }
  function clearLog() {
    $("log").textContent = "";
    state.toolEls = {};
    state.live = null;
    state.thinking = null;
  }
  function setStatus(kind, label) {
    var dot = $("h-dot");
    dot.className = "dot " + (kind || "");
    $("h-state").textContent = label;
  }

  /* ── frame handling ─────────────────────────────────────────────── */
  function eventText(data) {
    if (!data) return "";
    if (typeof data.text === "string" && data.text) return data.text;
    // assistant/message wraps the message; user/message IS the message.
    if (data.message) return text(data.message.content);
    if (Array.isArray(data.content)) return text(data.content);
    return "";
  }
  /** Flatten a tool/result event: message.content holds {type:'tool-result'} blocks. */
  function resultText(data) {
    var msg = data && data.message;
    if (!msg) return "";
    var out = [];
    (msg.content || []).forEach(function (block) {
      if (!block) return;
      if (block.type === "tool-result") out.push(text(block.content));
      else if (typeof block.text === "string") out.push(block.text);
    });
    return out.join("\n");
  }
  /** The tool call a tool/result event answers (message.source.callId). */
  function resultCallId(data) {
    var msg = data && data.message;
    if (!msg) return "";
    if (msg.source && msg.source.callId) return String(msg.source.callId);
    var block = (msg.content || []).filter(function (b) { return b && b.type === "tool-result"; })[0];
    return block && block.toolCallId ? String(block.toolCallId) : "";
  }
  /** Whether a tool/result event reports failure. */
  function resultIsError(data) {
    if (data && data.error) return true;
    var msg = data && data.message;
    var block = msg && (msg.content || []).filter(function (b) { return b && b.type === "tool-result"; })[0];
    return Boolean(block && block.isError);
  }
  function handleEvent(ev) {
    var type = ev.type || "";
    var data = ev.data || {};
    if (typeof ev.seq === "number") state.lastSeq = ev.seq;
    if (type === "user/message") {
      var t = eventText(data);
      if (t) addBubble("me", t);
      return;
    }
    if (type === "assistant/message") {
      var a = eventText(data);
      var thinking = data.message ? reasoningText(data.message.content) : "";
      // The committed message supersedes whatever the live stream accumulated.
      discardLive();
      clearThinking();
      if (thinking) addThinking(thinking, false);
      if (a) addBubble("assistant", a);
      return;
    }
    if (type === "tool/call") {
      addTool(String(data.callId || ""), String(data.name || "tool"), data.arguments);
      return;
    }
    if (type === "tool/result") {
      finishTool(resultCallId(data), resultText(data), resultIsError(data));
      return;
    }
    if (type === "turn/start") { setRunning(true); return; }
    if (type === "turn/end") {
      clearThinking();
      closeLive();
      setRunning(false);
      var reason = data.reason && data.reason.kind;
      if (reason === "error") addBubble("err", "运行出错：" + ((data.reason.error && data.reason.error.message) || "unknown"));
      else if (reason === "aborted") addBubble("sys", "已停止");
      else if (reason === "max-tokens") addBubble("sys", "达到 token 上限，已暂停");
      return;
    }
    // Anything else is surfaced only in verbose mode (long-press the title).
    if (state.verbose) addBubble("sys", type + " " + JSON.stringify(data).slice(0, 400));
  }
  function handleStreamFrame(frame) {
    if (!frame) return;
    if (frame.type === "snapshot") { renderSnapshot(frame); return; }
    if (frame.type === "assistant-stream") { handleAssistantStream(frame.frame); return; }
    if (frame.type === "event" && frame.event) { handleEvent(frame.event); return; }
    if (frame.type === "events" && Array.isArray(frame.events)) {
      frame.events.forEach(function (e) { if (e) handleEvent(e); });
      return;
    }
    // Some carriers inline the event instead of nesting it.
    if (typeof frame.type === "string" && frame.seq !== undefined) handleEvent(frame);
  }
  function handleAssistantStream(f) {
    if (!f) return;
    if (f.type === "chunk" && f.chunk) {
      var c = f.chunk;
      if (c.type === "text-delta" && c.text) { setRunning(true); clearThinking(); pushLive(c.text); }
      else if (c.type === "reasoning-delta" && c.text) { setRunning(true); showThinking(); }
      else if (c.type === "tool-call-delta" && c.name) { clearThinking(); }
      return;
    }
    if (f.type === "end") { clearThinking(); closeLive(); }
    if (f.type === "start") { setRunning(true); }
  }
  function renderSnapshot(frame) {
    clearLog();
    state.lastSeq = typeof frame.cursor === "number" ? frame.cursor : 0;
    var records = Array.isArray(frame.records) ? frame.records : [];
    for (var i = 0; i < records.length; i++) {
      var rec = records[i];
      if (rec && rec.type === "event" && rec.event) handleEvent(rec.event);
      else if (rec && rec.event) handleEvent(rec.event);
    }
    closeLive();
    if (frame.assistantStream && frame.assistantStream.activeAttempt) {
      var attempt = frame.assistantStream.activeAttempt;
      var stream = Array.isArray(attempt.stream) ? attempt.stream : [];
      for (var k = 0; k < stream.length; k++) {
        var s = stream[k];
        if (!s) continue;
        // Live re-attach ships raw StreamChunks; a replayed attempt ships
        // AssistantStreamRecord batches ({type:'text-chunks', texts:[...]}).
        if (s.type === "text-delta" && s.text) pushLive(s.text);
        else if (s.type === "text-chunks" && Array.isArray(s.texts)) pushLive(s.texts.join(""));
        else if (s.type === "chunk" && s.chunk && s.chunk.type === "text-delta" && s.chunk.text) pushLive(s.chunk.text);
      }
      setRunning(true);
    }
    scrollDown(true);
    refreshTitle();
  }

  /* ── streaming connection ───────────────────────────────────────── */
  function disconnect() {
    if (state.es) { try { state.es.close(); } catch (e) {} state.es = null; }
  }
  function connect() {
    disconnect();
    if (!state.sessionId) { setStatus("", "未选择会话"); return; }
    setStatus("busy", "连接中…");
    var url = "/api/m/stream?session=" + encodeURIComponent(state.sessionId)
      + (state.lastSeq ? "&from=" + state.lastSeq : "");
    var es = new EventSource(url, { withCredentials: true });
    state.es = es;
    es.addEventListener("open", function () {
      state.retry = 0;
      setStatus(state.running ? "busy" : "on", state.running ? "运行中" : "已连接");
    });
    es.addEventListener("frame", function (evt) {
      var frame;
      try { frame = JSON.parse(evt.data); } catch (e) { return; }
      handleStreamFrame(frame);
      setStatus(state.running ? "busy" : "on", state.running ? "运行中" : "已连接");
    });
    es.addEventListener("notice", function (evt) {
      try {
        var n = JSON.parse(evt.data);
        if (n.message) addBubble(n.level === "error" ? "err" : "sys", n.message);
      } catch (e) {}
    });
    es.addEventListener("deliverable", function (evt) {
      try { addFileCard(JSON.parse(evt.data)); } catch (e) {}
    });
    es.addEventListener("deliverables", function (evt) {
      try {
        (JSON.parse(evt.data) || []).forEach(addFileCard);
      } catch (e) {}
    });
    es.addEventListener("error", function () {
      if (es.readyState === EventSource.CLOSED || es.readyState === 2) {
        setStatus("off", "连接断开，重连中…");
      } else {
        setStatus("", "重连中…");
      }
    });
  }
  function setRunning(running) {
    state.running = running;
    var btn = $("btn-send");
    if (running) { btn.classList.add("stop"); btn.textContent = "■"; btn.disabled = false; }
    else { btn.classList.remove("stop"); btn.textContent = "↑"; btn.disabled = false; }
    setStatus(running ? "busy" : "on", running ? "运行中" : "已连接");
  }

  /* ── sessions ───────────────────────────────────────────────────── */
  function refreshTitle() {
    var s = null;
    for (var i = 0; i < state.sessions.length; i++) {
      if (state.sessions[i].sessionId === state.sessionId) { s = state.sessions[i]; break; }
    }
    $("h-title").textContent = s ? (s.title || s.cwd || s.sessionId) : "DSH 遥控";
    $("h-sub").title = s ? s.sessionId : "";
    $("c-hint").textContent = state.sessionId ? ("会话 " + state.sessionId.slice(-8)) : "未选择会话";
  }
  function loadState() {
    return api("/api/m/state").then(function (data) {
      state.sessions = (data && data.sessions) || [];
      state.defaultCwd = (data && data.defaultCwd) || "";
      state.allowCreate = !data || data.allowCreate !== false;
      $("newcwd").placeholder = state.defaultCwd || "新会话工作目录（可选）";
      renderSessions();
      refreshTitle();
      ((data && data.deliverables) || []).forEach(addFileCard);
      return data;
    });
  }
  function renderSessions() {
    var list = $("sess-list");
    list.textContent = "";
    if (!state.sessions.length) {
      list.appendChild(el("div", "d", "没有找到会话"));
      return;
    }
    state.sessions.forEach(function (s) {
      var row = el("button", "sess" + (s.sessionId === state.sessionId ? " active" : ""));
      row.appendChild(el("span", "t", s.title || s.cwd || s.sessionId));
      var bits = [];
      if (s.running) bits.push("运行中");
      if (s.updatedAt) bits.push(timeAgo(s.updatedAt));
      if (s.cwd) bits.push(s.cwd);
      row.appendChild(el("span", "d", bits.join(" · ") || s.sessionId));
      row.addEventListener("click", function () {
        openSession(s.sessionId);
        closeDrawer();
      });
      list.appendChild(row);
    });
  }
  function timeAgo(ts) {
    var s = Math.max(0, (Date.now() - ts) / 1000);
    if (s < 60) return "刚刚";
    if (s < 3600) return Math.floor(s / 60) + " 分钟前";
    if (s < 86400) return Math.floor(s / 3600) + " 小时前";
    return Math.floor(s / 86400) + " 天前";
  }
  function openSession(id) {
    if (!id) return;
    state.sessionId = id;
    state.lastSeq = 0;
    var summary = null;
    for (var i = 0; i < state.sessions.length; i++) {
      if (state.sessions[i].sessionId === id) { summary = state.sessions[i]; break; }
    }
    setRunning(Boolean(summary && summary.running));
    clearLog();
    refreshTitle();
    renderSessions();
    connect();
  }
  function openDrawer() { $("drawer").classList.add("on"); $("scrim").classList.add("on"); loadState().catch(function () {}); }
  function closeDrawer() { $("drawer").classList.remove("on"); $("scrim").classList.remove("on"); }

  /* ── actions ────────────────────────────────────────────────────── */
  function send() {
    var ta = $("text");
    var value = ta.value.trim();
    if (state.running) { stop(); return; }
    var files = state.pending.filter(function (item) { return item.state === "ok"; });
    if (!value && files.length === 0) return;
    if (!state.sessionId) { addBubble("err", "请先在左上角选择一个会话"); return; }

    var shown = value;
    files.forEach(function (item) { shown += (shown ? "\n" : "") + "📎 " + item.name; });
    ta.value = "";
    autoGrow();
    addBubble("me", shown);
    state.pending = [];
    renderPending();
    setRunning(true);
    api("/api/m/prompt", { method: "POST", body: { sessionId: state.sessionId, text: buildPrompt(value, files), timeZone: timezone() } })
      .then(function () {})
      .catch(function (err) {
        setRunning(false);
        addBubble("err", "发送失败：" + err.message);
        ta.value = value;
        autoGrow();
      });
  }

  /** Uploaded files become a plain file list in the prompt: the agent reads them. */
  function buildPrompt(value, files) {
    if (files.length === 0) return value;
    var lines = ["📎 用户从手机上传了 " + files.length + " 个文件，已经放在工作目录里："];
    files.forEach(function (item) {
      lines.push("- " + item.path + "（原名 " + item.name + "，" + formatBytes(item.bytes) + "）");
    });
    lines.push("");
    lines.push(value || "请把这些文件处理一下。");
    return lines.join("\n");
  }

  function uploadFiles(fileList) {
    if (!state.sessionId) { addBubble("err", "请先选择一个会话，再传文件"); return; }
    var files = Array.prototype.slice.call(fileList);
    files.forEach(function (file) {
      var item = { name: file.name, bytes: file.size, path: "", state: "up" };
      state.pending.push(item);
      renderPending();
      fetch("/api/m/upload?session=" + encodeURIComponent(state.sessionId) + "&name=" + encodeURIComponent(file.name), {
        method: "POST",
        credentials: "same-origin",
        headers: state.token ? { "x-mobile-token": state.token } : {},
        body: file
      })
        .then(function (res) {
          return res.json().catch(function () { return {}; }).then(function (data) {
            if (!res.ok) throw new Error((data.error && data.error.message) || ("HTTP " + res.status));
            return data;
          });
        })
        .then(function (data) {
          item.path = data.path || data.absolute || file.name;
          item.bytes = typeof data.bytes === "number" ? data.bytes : file.size;
          item.state = "ok";
          if (data.insideWorkspace === false) {
            addBubble("sys", "注意：这个会话没有工作目录，文件放在 " + item.path + "，Agent 可能读不到它。");
          }
          renderPending();
        })
        .catch(function (err) {
          item.state = "bad";
          renderPending();
          addBubble("err", "上传失败（" + item.name + "）：" + (err.message || err));
        });
    });
  }

  function renderPending() {
    var box = $("pending");
    box.textContent = "";
    if (state.pending.length === 0) { box.classList.add("hidden"); return; }
    box.classList.remove("hidden");
    state.pending.forEach(function (item, index) {
      var chip = el("div", "chip " + (item.state === "bad" ? "bad" : item.state === "ok" ? "up" : ""));
      var icon = item.state === "up" ? "⏳ " : item.state === "bad" ? "⚠️ " : "📎 ";
      chip.appendChild(el("span", "n", icon + item.name));
      if (item.state === "ok" && item.bytes) chip.appendChild(el("span", null, formatBytes(item.bytes)));
      var remove = el("span", "x", "✕");
      remove.addEventListener("click", function () {
        state.pending.splice(index, 1);
        renderPending();
      });
      chip.appendChild(remove);
      box.appendChild(chip);
    });
  }

  function formatBytes(bytes) {
    if (typeof bytes !== "number") return "";
    if (bytes < 1024) return bytes + " B";
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + " KB";
    return (bytes / 1024 / 1024).toFixed(1) + " MB";
  }

  /** A file the agent sent: a plain link the phone browser can download. */
  function addFileCard(info) {
    if (!info || !info.id || state.delivered[info.id]) return;
    state.delivered[info.id] = true;
    var url = "/api/m/download/" + encodeURIComponent(info.id) + (state.token ? "?t=" + encodeURIComponent(state.token) : "");
    var card = el("a", "filecard");
    card.href = url;
    card.setAttribute("download", info.name || "file");
    card.appendChild(el("span", "ic", "📄"));
    var meta = el("div", "meta");
    meta.appendChild(el("div", "t", info.name || "file"));
    var bits = [formatBytes(info.bytes)].filter(Boolean);
    if (info.note) bits.push(info.note);
    meta.appendChild(el("div", "d", bits.join(" · ") || "点击下载"));
    card.appendChild(meta);
    card.appendChild(el("span", "dl", "下载 ↓"));
    $("log").appendChild(card);
    scrollDown(true);
  }
  function stop() {
    if (!state.sessionId) return;
    api("/api/m/cancel", { method: "POST", body: { sessionId: state.sessionId } })
      .catch(function (err) { addBubble("err", "停止失败：" + err.message); });
  }
  function newSession() {
    var cwd = $("newcwd").value.trim();
    api("/api/m/create", { method: "POST", body: { cwd: cwd || undefined } })
      .then(function (data) {
        if (!data || !data.sessionId) throw new Error("服务器没有返回会话 id");
        addBubble("sys", "已新建会话 " + data.sessionId);
        closeDrawer();
        return loadState().then(function () { openSession(data.sessionId); });
      })
      .catch(function (err) { addBubble("err", "新建会话失败：" + err.message); });
  }
  function timezone() {
    try { return Intl.DateTimeFormat().resolvedOptions().timeZone || ""; } catch (e) { return ""; }
  }
  function autoGrow() {
    var ta = $("text");
    ta.style.height = "auto";
    ta.style.height = Math.min(ta.scrollHeight, Math.round(window.innerHeight * 0.32)) + "px";
  }

  /* ── boot ───────────────────────────────────────────────────────── */
  function showGate(message) {
    $("app").classList.add("hidden");
    $("gate").classList.remove("hidden");
    $("gate-err").textContent = message || "";
    if (state.token) $("gate-token").value = state.token;
  }
  function boot() {
    $("app").classList.remove("hidden");
    $("gate").classList.add("hidden");
    setStatus("", "加载中…");
    loadState().then(function () {
      if (state.sessionId) { connect(); return; }
      var running = null;
      for (var i = 0; i < state.sessions.length; i++) {
        if (state.sessions[i].running) { running = state.sessions[i]; break; }
      }
      var pick = running || state.sessions[0];
      if (pick) openSession(pick.sessionId);
      else { setStatus("", "没有会话"); openDrawer(); }
    }).catch(function (err) {
      if (err.code === 401) showGate("口令无效或已过期");
      else { setStatus("off", "无法连接服务器"); addBubble("err", String(err.message || err)); }
    });
  }

  $("btn-send").addEventListener("click", send);
  $("btn-attach").addEventListener("click", function () {
    if (!state.sessionId) { addBubble("err", "请先选择一个会话，再传文件"); return; }
    $("file-input").click();
  });
  $("file-input").addEventListener("change", function (event) {
    var files = event.target.files;
    if (files && files.length) uploadFiles(files);
    event.target.value = "";
  });
  $("text").addEventListener("input", autoGrow);
  $("text").addEventListener("keydown", function (e) {
    if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); send(); }
  });
  $("btn-menu").addEventListener("click", openDrawer);
  $("drawer-close").addEventListener("click", closeDrawer);
  $("scrim").addEventListener("click", closeDrawer);
  $("btn-new").addEventListener("click", newSession);
  $("btn-reload").addEventListener("click", function () { loadState().then(connect).catch(function () {}); });
  var titlePress = null;
  $("h-title").addEventListener("touchstart", function () { titlePress = Date.now(); });
  $("h-title").addEventListener("touchend", function () {
    if (titlePress && Date.now() - titlePress > 800) { state.verbose = !state.verbose; addBubble("sys", "调试视图：" + (state.verbose ? "开" : "关")); }
    titlePress = null;
  });
  $("gate-go").addEventListener("click", function () {
    var value = $("gate-token").value.trim();
    if (!value) return;
    state.token = value;
    rememberToken(value);
    api("/api/m/state").then(function () { boot(); }).catch(function (err) {
      $("gate-err").textContent = err.code === 401 ? "口令不对" : String(err.message || err);
    });
  });
  window.addEventListener("pageshow", function () { if (state.started) refreshTitle(); });
  document.addEventListener("visibilitychange", function () {
    if (!document.hidden && state.sessionId) { loadState().catch(function () {}); }
  });

  state.started = true;
  if (!state.token) {
    // Cookie-only visitors (already logged in on this phone) still work: probe
    // the API once before asking for a token.
    api("/api/m/state").then(function () { boot(); }).catch(function () { showGate(""); });
  } else {
    boot();
  }
})();
</script>
</body>
</html>
